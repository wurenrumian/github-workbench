<!doctype html>
<html lang="zh-CN" class="ghw-native-hidden ghw-hide-sidebar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Workbench · 效果预览</title>
    <link rel="stylesheet" href="../src/content/styles.css" />
    <style>
      /* 这里只是把 GitHub 的外壳简陋地模拟一下，好看清「顶栏保留 + feed 被替换」的效果。
         扩展本身不需要这些样式。 */
      html,
      body {
        margin: 0;
        background: var(--bgColor-default, #ffffff);
        color: var(--fgColor-default, #1f2328);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      }

      .demo-bar {
        padding: 8px 24px;
        border-bottom: 1px dashed var(--borderColor-default, #d1d9e0);
        font-size: 11px;
        color: var(--fgColor-muted, #59636e);
      }

      /* 全局导航：扩展不碰它 */
      .gh-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 24px;
        background: var(--bgColor-muted, #f6f8fa);
        border-bottom: 1px solid var(--borderColor-default, #d1d9e0);
      }
      .gh-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #1f2328;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .gh-search {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 300px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--borderColor-default, #d1d9e0);
        border-radius: 6px;
        background: var(--bgColor-default, #fff);
        font-size: 12px;
        color: var(--fgColor-muted, #59636e);
      }
      .gh-search kbd {
        margin-left: auto;
        padding: 0 4px;
        border: 1px solid var(--borderColor-default, #d1d9e0);
        border-radius: 3px;
        font: inherit;
        font-size: 10px;
      }
      .gh-nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .gh-ico {
        width: 16px;
        height: 16px;
        border: 1.5px solid var(--fgColor-muted, #59636e);
        border-radius: 4px;
        opacity: 0.6;
      }
      .gh-me {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--borderColor-default, #d1d9e0);
      }

      /* 页面顶部：Home 标题 + 搜索 + 切换条，扩展也不碰 */
      .gh-main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 24px 48px;
      }
      .gh-page-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
      }
      .gh-page-top h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .gh-feed-search {
        width: 280px;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--borderColor-default, #d1d9e0);
        border-radius: 6px;
        background: var(--bgColor-muted, #f6f8fa);
        font-size: 12px;
        color: var(--fgColor-muted, #59636e);
      }
      .gh-tabs {
        display: flex;
        gap: 18px;
        border-bottom: 1px solid var(--borderColor-default, #d1d9e0);
        font-size: 13px;
        color: var(--fgColor-muted, #59636e);
      }
      .gh-tab {
        padding: 7px 0 9px;
      }
      .gh-tab.is-on {
        color: var(--fgColor-default, #1f2328);
        font-weight: 600;
        border-bottom: 2px solid #fd8c73;
      }
      .gh-tab.is-right {
        margin-left: auto;
        color: var(--fgColor-accent, #0969da);
      }

      .gh-cols {
        display: flex;
        gap: 24px;
        margin-top: 16px;
      }
      .gh-col-main {
        flex: 1;
        min-width: 0;
      }
      .feed-right-sidebar {
        width: 300px;
        flex: none;
        font-size: 12px;
        color: var(--fgColor-muted, #59636e);
      }
      .feed-left-sidebar {
        width: 240px;
        flex: none;
        font-size: 13px;
      }
      .gh-sideitem {
        padding: 6px 10px;
        border-radius: 6px;
        color: var(--fgColor-default, #1f2328);
      }
      .gh-sideitem.is-on {
        background: var(--bgColor-muted, #f6f8fa);
        font-weight: 600;
      }

      /* 假的原生 feed，正常情况下会被扩展的 .ghw-surgical 规则藏掉 */
      .gh-feedcard,
      .gh-sidecard {
        padding: 14px;
        margin-bottom: 10px;
        border: 1px solid var(--borderColor-default, #d1d9e0);
        border-radius: 8px;
        font-size: 13px;
        color: var(--fgColor-muted, #59636e);
      }

      /* 预览页里没有 GitHub 自己的样式表，这里补一套包含暗色的变量垫片，
         让预览和真实页面上的取值一致（扩展里由 GitHub 提供这些变量） */
      html[data-color-mode='dark'] {
        --bgColor-default: #0d1117;
        --bgColor-inset: #010409;
        --bgColor-muted: #151b23;
        --fgColor-default: #e6edf3;
        --fgColor-muted: #9198a1;
        --borderColor-default: #3d444d;
        --borderColor-muted: #3d444db3;
        --fgColor-accent: #4493f8;
        --fgColor-success: #3fb950;
        --fgColor-done: #ab7df8;
        --fgColor-danger: #f85149;
      }
      html[data-color-mode='dark'] .gh-mark {
        background: #e6edf3;
        color: #0d1117;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">效果预览 · 数据是假的，只用来检查排版（加 <code>?dark</code> 看暗色）</div>

    <!-- GitHub 全局导航：扩展完全不动它 -->
    <header class="gh-nav">
      <div class="gh-mark">GH</div>
      <div class="gh-search">Type <kbd>/</kbd> to search…</div>
      <div class="gh-nav-right">
        <span class="gh-ico"></span>
        <span class="gh-ico" style="border-radius: 50%"></span>
        <span class="gh-me"></span>
      </div>
    </header>

    <!-- 页面主体：扩展只接管中间的内容区 -->
    <div class="gh-main">
      <div class="gh-cols">
        <!-- 原生的左侧导航栏：开关打开时会被收掉（当前默认收起） -->
        <aside class="feed-left-sidebar">
          <div class="gh-sideitem is-on">Home</div>
          <div class="gh-sideitem">Feed</div>
          <div class="gh-sideitem">Repositories</div>
        </aside>

        <div class="gh-col-main">
          <!-- 工作台插在 main 原来的位置 -->
          <div id="ghw-root" class="ghw-root"></div>

          <!-- 原生的 dashboard 内容：被 html.ghw-native-hidden main 藏掉 -->
          <main>
            <div class="gh-feedcard">Good afternoon · 原生 Copilot 输入条</div>
            <div class="gh-feedcard">Pull requests · 原生列表</div>
          </main>
        </div>
      </div>
    </div>

    <script src="../src/core/util.js"></script>
    <script src="../src/content/ui.js"></script>
    <script>
      (function () {
        // 加上 ?dark 就能看暗色效果
        if (/dark/.test(location.search)) document.documentElement.dataset.colorMode = 'dark';
        var U = GHW.util;

        /* --- 造一年的贡献数据，形态和 parseContributions 的输出一致 --- */
        var days = [];
        var start = new Date('2025-11-23T00:00:00');
        for (var i = 0; i < 365; i++) {
          var d = U.addDays(start, i);
          var wd = d.getDay();
          var seed = (i * 2654435761) % 1000;
          var base = wd === 0 || wd === 6 ? 0 : 3;
          var count = seed % 100 < 26 ? 0 : base + (seed % 11);
          if (i > 300 && seed % 7 < 3) count += 4;
          var level = count === 0 ? 0 : count < 3 ? 1 : count < 6 ? 2 : count < 10 ? 3 : 4;
          days.push({ date: U.dayKey(d), level: level, count: count });
        }
        /* summarize 在 parse.js 里（预览页不加载它），这里算一份等价的结果 */
        var total = 0,
          active = 0,
          longest = 0,
          run = 0,
          best = days[0];
        days.forEach(function (d) {
          total += d.count;
          if (d.count) active++;
          if (d.count > best.count) best = d;
          if (d.count) {
            run++;
            longest = Math.max(longest, run);
          } else run = 0;
        });
        var today = U.dayKey(new Date());
        var streak = 0;
        for (var k = days.length - 1; k >= 0; k--) {
          if (days[k].date === today && days[k].count === 0) continue;
          if (days[k].count > 0) streak++;
          else break;
        }
        var week = 0;
        var now = new Date();
        var monday = U.addDays(now, -((now.getDay() + 6) % 7));
        for (var w = 0; w < 7; w++) {
          var key = U.dayKey(U.addDays(monday, w));
          days.forEach(function (d) {
            if (d.date === key) week += d.count;
          });
        }

        var contributions = {
          days: days,
          total: total,
          activeDays: active,
          todayCount: days[days.length - 1].count,
          currentStreak: streak,
          longestStreak: longest,
          weekTotal: week,
          bestDay: best,
          from: days[0].date,
          to: days[days.length - 1].date
        };

        var settings = {
          enabled: true,
          hideNative: true,
          keepChrome: false,
          refreshMinutes: 10,
          listLimit: 8,
          repoCount: 6,
          starredCount: 4,
          panels: {
            contributions: true,
            issues: true,
            review: true,
            opened: true,
            starred: true,
            repos: true,
            pinned: true
          }
        };

        var app = GHW.ui.create({
          login: 'octocat',
          settings: settings,
          onRefresh: function () {},
          onRetry: function () {},
          onToggleNative: function () {}
        });
        document.getElementById('ghw-root').appendChild(app.el);

        app.apply('profile', {
          data: {
            meta: { name: 'The Octocat', bio: 'Builds small things. Occasionally breaks bigger ones.', followers: '16.4k', following: '9', location: 'Hangzhou', company: 'GitHub', website: 'https://octocat.example.com' },
            pinned: [
              { fullName: 'octocat/Hello-World', href: '/octocat/Hello-World', description: 'My first repository on GitHub', language: 'Ruby', languageColor: '#701516', stars: '2.7k' },
              { fullName: 'octocat/spoon-knife', href: '/octocat/spoon-knife', description: 'React hooks 的边角料收集', language: 'TypeScript', languageColor: '#3178c6', stars: '318' }
            ]
          }
        });

        app.apply('contributions', { data: contributions, fromCache: true, at: Date.now() });

        app.apply('assigned', {
          data: [
            { type: 'issue', number: 1284, title: '虚拟列表滚动到底部时偶发白屏', href: '/acme/web/issues/1284', repoFullName: 'acme/web', updated: '2026-11-21T09:00:00Z', state: 'open', labels: ['bug', 'P1'], author: 'kai', comments: 6, excerpt: '在 Safari 上滚到第 2000 条左右会白屏，怀疑是 recycle 时 key 复用导致的。' },
            { type: 'issue', number: 77, title: 'Support streaming responses in the SDK', href: '/acme/sdk/issues/77', repoFullName: 'acme/sdk', updated: '2026-11-20T15:20:00Z', state: 'open', labels: ['enhancement'], author: 'lin', comments: 2, excerpt: 'Currently the client buffers the whole body. A stream() helper would unblock the CLI use case.' },
            { type: 'issue', number: 9, title: 'CI 在 Windows runner 上超时', href: '/acme/infra/issues/9', repoFullName: 'acme/infra', updated: '2026-11-18T02:10:00Z', state: 'open', labels: [] }
          ]
        });

        app.apply('created', {
          data: [
            { type: 'issue', number: 1301, title: '给首页加一个自己的面板', href: '/acme/web/issues/1301', repoFullName: 'acme/web', updated: '2026-11-22T03:00:00Z', state: 'open', labels: ['enhancement'], author: 'octocat', comments: 4, excerpt: '现在的首页信息密度太低，想自己拼一块出来。' },
            { type: 'issue', number: 61, title: '文档里的锚点链接全部失效', href: '/acme/docs/issues/61', repoFullName: 'acme/docs', updated: '2026-11-15T06:00:00Z', state: 'open', labels: ['docs'] }
          ]
        });

        app.apply('review', {
          data: [
            { type: 'pr', number: 331, title: 'refactor: 拆掉 useSession 里的隐式全局状态', href: '/acme/web/pull/331', repoFullName: 'acme/web', updated: '2026-11-22T00:40:00Z', state: 'open', labels: ['review'] },
            { type: 'pr', number: 45, title: 'Add retry with jitter to the HTTP client', href: '/acme/sdk/pull/45', repoFullName: 'acme/sdk', updated: '2026-11-19T11:00:00Z', state: 'open', labels: [] }
          ]
        });

        app.apply('opened', {
          data: [
            { type: 'pr', number: 1202, title: 'fix: 修正时区换算', href: '/acme/web/pull/1202', repoFullName: 'acme/web', updated: '2026-11-20T07:30:00Z', state: 'draft', labels: [] }
          ]
        });

        app.apply('starred', {
          data: [
            { fullName: 'modular/modular', href: '/modular/modular', description: 'The Modular Platform (includes MAX & Mojo)', language: 'Mojo', languageColor: '#ff4c1f', stars: '24.1k', updated: null, visibility: '' },
            { fullName: 'openchamber/openchamber', href: '/openchamber/openchamber', description: 'Desktop and web interface for OpenCode AI agent', language: 'TypeScript', languageColor: '#3178c6', stars: '2.6k', updated: null, visibility: '' },
            { fullName: 'chenmozhijin/NijiLucid', href: '/chenmozhijin/NijiLucid', description: '暂无描述', language: 'Python', languageColor: '#3572A5', stars: '1.2k', updated: null, visibility: '' },
            { fullName: 'godwit-email/godwit', href: '/godwit-email/godwit', description: '', language: 'Rust', languageColor: '#dea584', stars: '480', updated: null, visibility: '' }
          ]
        });

        app.apply('repos', {
          data: [
            { fullName: 'octocat/Hello-World', href: '/octocat/Hello-World', description: 'My first repository on GitHub', language: 'Ruby', languageColor: '#701516', stars: '2.7k', updated: '2026-11-22T01:31:18Z', visibility: 'Public' },
            { fullName: 'octocat/spoon-knife', href: '/octocat/spoon-knife', description: 'React hooks 的边角料收集', language: 'TypeScript', languageColor: '#3178c6', stars: '318', updated: '2026-11-19T12:00:00Z', visibility: 'Public' },
            { fullName: 'octocat/notes', href: '/octocat/notes', description: '', language: 'Markdown', languageColor: '#083fa1', stars: '12', updated: '2026-11-10T08:00:00Z', visibility: 'Private' },
            { fullName: 'octocat/dotfiles', href: '/octocat/dotfiles', description: 'chezmoi 管理的跨机器配置', language: 'Shell', languageColor: '#89e051', stars: '64', updated: '2026-10-28T08:00:00Z', visibility: 'Private' }
          ]
        });

        app.setFooter('更新于 09:41 · 缓存 10 分钟');
      })();
    </script>
  </body>
</html>
